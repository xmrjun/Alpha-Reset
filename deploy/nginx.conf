# Alpha-Reset 反向代理模板 —— 与线上配置保持同步。
#
# 使用：把 example.com 换成你的域名，证书路径换成你自己的，放进
# /etc/nginx/sites-available/ 并软链到 sites-enabled/，然后 nginx -t && systemctl reload nginx。
#
# 三处不能省：
# 1. location /api/agent/ 的 proxy_read_timeout 120s 与 proxy_buffering off ——
#    一轮工具调用要 30~60 秒，默认 60s 超时会把聊天切断。
# 2. location / 里的那几个 add_header ——nginx 的 add_header 不继承，
#    写在 server 级会被这个 location 自己的 add_header 挤掉，一个安全头都不会生效。
# 3. limit_req_zone 必须写在 server 块之前（http 上下文）。
#
# Alpha-Reset 前端 + JSON API
# 站点走 Cloudflare 代理（橙云），回源为 HTTP；公开访问，不设鉴权。
# agent 端点的限速。配额计数虽然已经落库（重启不清零），但把进程打崩仍然会中断
# 服务，所以在 nginx 这一层先挡住爆破。一次提问最多 6 轮工具调用，60r/m + burst 30
# 对正常使用绰绰有余。
limit_req_zone $binary_remote_addr zone=agent_api:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=agent_conn:10m;

server {
    # 同时监听 80 和 443：Cloudflare 的 SSL 模式若为 Flexible 走 80，
    # 若为 Full / Full(strict 除外) 则走 443。只开 80 会导致 CF 报 521。
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    # 回源证书：CF 与源站之间加密。Full（非 strict）接受自签，
    # 若 CF 设为 Full (strict)，需换成 Cloudflare Origin 证书。
    ssl_certificate     /etc/nginx/ssl/YOUR_SITE.crt;
    ssl_certificate_key /etc/nginx/ssl/YOUR_SITE.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;

    root /var/www/alpha;

    # 安全响应头。当前前端没有 XSS 汇点（全走 React 文本节点、无 dangerouslySetInnerHTML），
    # 但用户的 Orbio key 和整份对话都在 localStorage 里 —— CSP 是唯一能让「将来某天
    # 引入了 XSS」不等于「所有人的 key 全部失窃」的东西。构建产物是外链 /assets/*.js，
    # 所以 script-src 不需要 'unsafe-inline'。
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    index index.html;

    # Cloudflare 回源时取真实访客 IP
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/alpha.access.log;
    error_log  /var/log/nginx/alpha.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带内容哈希的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # JSON API 反代到本机服务（服务只监听 127.0.0.1，不直接暴露）
    # 本地 REST 采集/计算结果通过此连接持续推送。
    location = /api/live {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    # Agent 对话要跑多轮工具调用，30 秒不够；关掉缓冲让流式响应将来也能直通。
    location /api/agent/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_next_upstream off;
        limit_req zone=agent_api burst=30 nodelay;
        limit_conn agent_conn 6;
        client_max_body_size 2m;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
    }

    # SPA 路由：未命中的路径一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # nginx 的 add_header 不继承：子 location 一旦有自己的 add_header，
        # 父级那几条就全部失效，所以这里必须重复一遍。
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
